<svg xmlns="http://www.w3.org/2000/svg" width="320" height="356" viewBox="0 0 320 356" role="img" aria-label="By the numbers: 27, WordPress sites built or run; 15+, in-house plugins; 1,000+, commits since late 2025; 528, commits to claude-wp-builder.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0a0a0f"/><stop offset="54%" stop-color="#101018"/><stop offset="100%" stop-color="#0a0a0f"/>
  </linearGradient>
  <radialGradient id="glow-a"><stop offset="0%" stop-color="#7b93f5" stop-opacity="0.13"/><stop offset="100%" stop-color="#7b93f5" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow-b"><stop offset="0%" stop-color="#3858e9" stop-opacity="0.12"/><stop offset="100%" stop-color="#3858e9" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .glow-a { animation: drift-a 14s ease-in-out infinite; }
  .glow-b { animation: drift-b 18s ease-in-out infinite; }
  .in { animation: fade-in 0.6s ease-out backwards; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes drift-a { 50% { transform: translate(40px, 12px); } }
  @keyframes drift-b { 50% { transform: translate(-36px, -10px); } }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="320" height="356" rx="16" fill="url(#bg)"/>
<ellipse class="glow-a" cx="64" cy="35.6" rx="112" ry="213.6" fill="url(#glow-a)"/>
<ellipse class="glow-b" cx="256" cy="338.2" rx="112" ry="213.6" fill="url(#glow-b)"/>
<text x="16" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="800" letter-spacing="4" fill="#8b949e">BY THE NUMBERS</text>
<g class="in" style="animation-delay:0.00s"><rect x="14" y="60" width="292" height="62" rx="14" fill="rgba(8,8,12,0.5)" stroke="#7b93f5" stroke-opacity="0.5"/><rect x="14" y="74" width="4" height="34" rx="2" fill="#7b93f5"/><text x="34" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="850" fill="#e6edf3">27</text><text x="34" y="107" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#8b949e">WordPress sites built or run</text></g>
<g class="in" style="animation-delay:0.08s"><rect x="14" y="132" width="292" height="62" rx="14" fill="rgba(8,8,12,0.5)" stroke="#7b93f5" stroke-opacity="0.5"/><rect x="14" y="146" width="4" height="34" rx="2" fill="#4a68ee"/><text x="34" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="850" fill="#e6edf3">15+</text><text x="34" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#8b949e">in-house plugins</text></g>
<g class="in" style="animation-delay:0.16s"><rect x="14" y="204" width="292" height="62" rx="14" fill="rgba(8,8,12,0.5)" stroke="#7b93f5" stroke-opacity="0.5"/><rect x="14" y="218" width="4" height="34" rx="2" fill="#3858e9"/><text x="34" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="850" fill="#e6edf3">1,000+</text><text x="34" y="251" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#8b949e">commits since late 2025</text></g>
<g class="in" style="animation-delay:0.24s"><rect x="14" y="276" width="292" height="62" rx="14" fill="rgba(8,8,12,0.5)" stroke="#7b93f5" stroke-opacity="0.5"/><rect x="14" y="290" width="4" height="34" rx="2" fill="#2c45c4"/><text x="34" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="850" fill="#e6edf3">528</text><text x="34" y="323" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#8b949e">commits to claude-wp-builder</text></g>
<rect x="0.5" y="0.5" width="319" height="355" rx="15.5" fill="none" stroke="#7b93f5" stroke-opacity="0.62"/>
</svg>
