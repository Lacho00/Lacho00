<g class="in" style="animation-delay:0.16s"><rect x="574.6666666666666" y="60" width="257.3333333333333" height="96" rx="16" fill="rgba(8,8,12,0.5)" stroke="#7b93f5" stroke-opacity="0.5"/><rect x="574.6666666666666" y="82" width="4" height="52" rx="2" fill="#2c45c4"/><text x="598.6666666666666" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="850" fill="#e6edf3">Multilingual</text><text x="598.6666666666666" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#8b949e">Polylang &amp; WPML on 8 sites</text></g>
<rect x="0.5" y="0.5" width="859" height="179" rx="19.5" fill="none" stroke="#7b93f5" stroke-opacity="0.62"/>
