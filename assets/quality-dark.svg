<circle cx="530.5" cy="104" r="38" fill="none" stroke="#16161f" stroke-width="7"/><circle class="g2" cx="530.5" cy="104" r="38" fill="none" stroke="#3858e9" stroke-width="7" stroke-linecap="round" stroke-dasharray="238.8" stroke-dashoffset="16.7" transform="rotate(-90 530.5 104)"/><text x="530.5" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="850" text-anchor="middle" fill="#e6edf3">90+</text><text x="530.5" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9aabf5">SEO</text>
<circle cx="731.5" cy="104" r="38" fill="none" stroke="#16161f" stroke-width="7"/><circle class="g3" cx="731.5" cy="104" r="38" fill="none" stroke="#9aabf5" stroke-width="7" stroke-linecap="round" stroke-dasharray="238.8" stroke-dashoffset="47.8" transform="rotate(-90 731.5 104)"/><text x="731.5" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="850" text-anchor="middle" fill="#e6edf3">80%</text><text x="731.5" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9aabf5">Audit criteria</text>
