<svg xmlns="http://www.w3.org/2000/svg" width="320" height="306" viewBox="0 0 320 306" role="img" aria-label="Measured quality: Performance 90+, Accessibility 90+, SEO 90+, Audit criteria 80%. Lighthouse, mean of 8 pages on an audited client build.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0a0a0f"/><stop offset="54%" stop-color="#101018"/><stop offset="100%" stop-color="#0a0a0f"/>
  </linearGradient>
  <radialGradient id="glow-a"><stop offset="0%" stop-color="#7b93f5" stop-opacity="0.13"/><stop offset="100%" stop-color="#7b93f5" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow-b"><stop offset="0%" stop-color="#3858e9" stop-opacity="0.12"/><stop offset="100%" stop-color="#3858e9" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .glow-a { animation: drift-a 14s ease-in-out infinite; }
  .glow-b { animation: drift-b 18s ease-in-out infinite; }
  .in { animation: fade-in 0.6s ease-out backwards; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes drift-a { 50% { transform: translate(40px, 12px); } }
  @keyframes drift-b { 50% { transform: translate(-36px, -10px); } }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  .g0 { animation: g0 1.6s cubic-bezier(.2,.7,.2,1) 0.30s backwards; } @keyframes g0 { from { stroke-dashoffset: 188.5; } }
  .g1 { animation: g1 1.6s cubic-bezier(.2,.7,.2,1) 0.45s backwards; } @keyframes g1 { from { stroke-dashoffset: 188.5; } }
  .g2 { animation: g2 1.6s cubic-bezier(.2,.7,.2,1) 0.60s backwards; } @keyframes g2 { from { stroke-dashoffset: 188.5; } }
  .g3 { animation: g3 1.6s cubic-bezier(.2,.7,.2,1) 0.75s backwards; } @keyframes g3 { from { stroke-dashoffset: 188.5; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="320" height="306" rx="16" fill="url(#bg)"/>
<ellipse class="glow-a" cx="64" cy="30.6" rx="112" ry="183.6" fill="url(#glow-a)"/>
<ellipse class="glow-b" cx="256" cy="290.7" rx="112" ry="183.6" fill="url(#glow-b)"/>
<text x="16" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="800" letter-spacing="4" fill="#8b949e">MEASURED QUALITY</text>
<circle cx="87" cy="96" r="30" fill="none" stroke="#16161f" stroke-width="6"/><circle class="g0" cx="87" cy="96" r="30" fill="none" stroke="#7b93f5" stroke-width="6" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="3.8" transform="rotate(-90 87 96)"/><text x="87" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="850" text-anchor="middle" fill="#e6edf3">90+</text><text x="87" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9aabf5">Performance</text>
<circle cx="233" cy="96" r="30" fill="none" stroke="#16161f" stroke-width="6"/><circle class="g1" cx="233" cy="96" r="30" fill="none" stroke="#4a68ee" stroke-width="6" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="7.5" transform="rotate(-90 233 96)"/><text x="233" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="850" text-anchor="middle" fill="#e6edf3">90+</text><text x="233" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9aabf5">Accessibility</text>
<circle cx="87" cy="202" r="30" fill="none" stroke="#16161f" stroke-width="6"/><circle class="g2" cx="87" cy="202" r="30" fill="none" stroke="#3858e9" stroke-width="6" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="13.2" transform="rotate(-90 87 202)"/><text x="87" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="850" text-anchor="middle" fill="#e6edf3">90+</text><text x="87" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9aabf5">SEO</text>
