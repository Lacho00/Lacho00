<svg xmlns="http://www.w3.org/2000/svg" width="400" height="252" viewBox="0 0 400 252" role="img" aria-label="About: I build custom WordPress themes and WooCommerce stores, and the tools behind them. Open to WordPress and automation work.">
<defs>
  <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0a0a0f"/><stop offset="54%" stop-color="#101018"/><stop offset="100%" stop-color="#0a0a0f"/>
  </linearGradient>
</defs>
<style>
  .ring { animation: m-pulse 4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .cursor { animation: m-blink 1.1s steps(1) infinite; }
  @keyframes m-pulse { 50% { opacity: 0.4; } }
  @keyframes m-blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ring, .cursor { animation: none; } }
</style>
<rect width="400" height="252" rx="18" fill="url(#m-bg)"/>
<circle class="ring" cx="340" cy="70" r="22" fill="none" stroke="#e6edf3" stroke-opacity="0.3"/>
<circle class="ring" cx="340" cy="70" r="38" fill="none" stroke="#e6edf3" stroke-opacity="0.16"/>
<rect x="16" y="16" width="368" height="220" rx="16" fill="rgba(8,8,12,0.5)" stroke="#7b93f5" stroke-opacity="0.5"/>
<text x="34" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="800" letter-spacing="4" fill="#8b949e">ABOUT</text>
<text x="34" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="820" letter-spacing="-0.3" fill="#e6edf3">I build custom WordPress</text>
<text x="34" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="820" letter-spacing="-0.3" fill="#e6edf3">themes and WooCommerce</text>
<text x="34" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="820" letter-spacing="-0.3" fill="#e6edf3">stores, and the tools</text>
<text x="34" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="820" letter-spacing="-0.3" fill="#e6edf3">behind them.</text>
<text x="34" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="750" fill="#7b93f5">&gt; open to WordPress &amp; automation work<tspan class="cursor">_</tspan></text>
<rect x="0.5" y="0.5" width="399" height="251" rx="17.5" fill="none" stroke="#7b93f5" stroke-opacity="0.62"/>
</svg>
