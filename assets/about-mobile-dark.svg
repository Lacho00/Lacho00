<svg xmlns="http://www.w3.org/2000/svg" width="320" height="237.2" viewBox="0 0 320 237.2" role="img" aria-label="About: I build custom WordPress themes and WooCommerce stores, and the tools behind them. open to WordPress &amp; automation work.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0a0a0f"/><stop offset="54%" stop-color="#101018"/><stop offset="100%" stop-color="#0a0a0f"/>
  </linearGradient>
  <radialGradient id="glow-a"><stop offset="0%" stop-color="#7b93f5" stop-opacity="0.13"/><stop offset="100%" stop-color="#7b93f5" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow-b"><stop offset="0%" stop-color="#3858e9" stop-opacity="0.12"/><stop offset="100%" stop-color="#3858e9" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .glow-a { animation: drift-a 14s ease-in-out infinite; }
  .glow-b { animation: drift-b 18s ease-in-out infinite; }
  .in { animation: fade-in 0.6s ease-out backwards; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes drift-a { 50% { transform: translate(40px, 12px); } }
  @keyframes drift-b { 50% { transform: translate(-36px, -10px); } }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="320" height="237.2" rx="16" fill="url(#bg)"/>
<ellipse class="glow-a" cx="64" cy="23.72" rx="112" ry="142.32" fill="url(#glow-a)"/>
<ellipse class="glow-b" cx="256" cy="225.33999999999997" rx="112" ry="142.32" fill="url(#glow-b)"/>
<rect x="12" y="12" width="296" height="213.2" rx="20" fill="rgba(8,8,12,0.5)" stroke="#7b93f5" stroke-opacity="0.5"/>
<text x="28" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="800" letter-spacing="4" fill="#8b949e">ABOUT</text>
<text class="in" x="28" y="90" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="820" letter-spacing="-0.3" fill="#e6edf3">I build custom</text>
<text class="in" x="28" y="116.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="820" letter-spacing="-0.3" fill="#e6edf3">WordPress themes and</text>
<text class="in" x="28" y="142.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="820" letter-spacing="-0.3" fill="#e6edf3">WooCommerce stores,</text>
<text class="in" x="28" y="169.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="820" letter-spacing="-0.3" fill="#e6edf3">and the tools behind them.</text>
<text x="28" y="201.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="750" fill="#7b93f5">&gt; open to WordPress &amp; automation work<tspan class="cursor">_</tspan></text>
