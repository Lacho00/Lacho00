<svg xmlns="http://www.w3.org/2000/svg" width="860" height="423" viewBox="0 0 860 423" role="img" aria-label="Projects: claude-wp-builder, Claude Code plugin that turns an approved HTML demo into a custom WordPress theme.; ix-wp-envsync, Syncs a WordPress site between local, staging and production, with rollback.; issue-bot, Telegram bot that takes a site issue, agrees a plan, fixes it with Claude Code and returns a before/after report.">
