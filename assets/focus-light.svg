    @keyframes gs-highlights-lacho00-aurora-light-float-c { 0%,100% { transform: translate(0,0) scale(1); opacity: .34; } 50% { transform: translate(18px,-12px) scale(1.18); opacity: .62; } }
    @keyframes gs-highlights-lacho00-aurora-light-ring { 0%,100% { opacity: .06; } 50% { opacity: .22; } }
    @keyframes gs-highlights-lacho00-aurora-light-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
