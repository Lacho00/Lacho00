<svg xmlns="http://www.w3.org/2000/svg" width="860" height="197" viewBox="0 0 860 197" role="img" aria-label="By the numbers: 27, WordPress sites built or run; 15+, in-house plugins; 1,000+, commits since late 2025; 553, commits to claude-wp-builder.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0a0a0f"/><stop offset="54%" stop-color="#101018"/><stop offset="100%" stop-color="#0a0a0f"/>
  </linearGradient>
  <radialGradient id="glow-a"><stop offset="0%" stop-color="#7b93f5" stop-opacity="0.13"/><stop offset="100%" stop-color="#7b93f5" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow-b"><stop offset="0%" stop-color="#3858e9" stop-opacity="0.12"/><stop offset="100%" stop-color="#3858e9" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .glow-a { animation: drift-a 14s ease-in-out infinite; }
  .glow-b { animation: drift-b 18s ease-in-out infinite; }
  .in { animation: fade-in 0.6s ease-out backwards; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes drift-a { 50% { transform: translate(40px, 12px); } }
  @keyframes drift-b { 50% { transform: translate(-36px, -10px); } }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
