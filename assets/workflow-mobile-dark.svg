<svg xmlns="http://www.w3.org/2000/svg" width="320" height="318" viewBox="0 0 320 318" role="img" aria-label="Workflow: Design (Figma), then Demo (pixel-close HTML), then Theme (ACF + i18n), then Audit (a11y · SEO · speed), then Ship (env sync).">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0a0a0f"/><stop offset="54%" stop-color="#101018"/><stop offset="100%" stop-color="#0a0a0f"/>
  </linearGradient>
  <radialGradient id="glow-a"><stop offset="0%" stop-color="#7b93f5" stop-opacity="0.13"/><stop offset="100%" stop-color="#7b93f5" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow-b"><stop offset="0%" stop-color="#3858e9" stop-opacity="0.12"/><stop offset="100%" stop-color="#3858e9" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .glow-a { animation: drift-a 14s ease-in-out infinite; }
  .glow-b { animation: drift-b 18s ease-in-out infinite; }
  .in { animation: fade-in 0.6s ease-out backwards; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes drift-a { 50% { transform: translate(40px, 12px); } }
  @keyframes drift-b { 50% { transform: translate(-36px, -10px); } }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse { animation: pulse 6s cubic-bezier(.45,0,.55,1) infinite; } @keyframes pulse { 0% { transform: translateY(0); opacity: 0; } 6% { opacity: 1; } 88% { opacity: 1; } 94%, 100% { transform: translateY(200px); opacity: 0; } }
  .n0 { animation: n0 6s linear infinite; } @keyframes n0 { 0%, 0.5% { fill: #101018; } 1.0%, 13.0% { fill: #7b93f5; } 21.0%, 100% { fill: #101018; } }
  .n1 { animation: n1 6s linear infinite; } @keyframes n1 { 0%, 32.7% { fill: #101018; } 33.2%, 45.2% { fill: #7b93f5; } 53.2%, 100% { fill: #101018; } }
  .n2 { animation: n2 6s linear infinite; } @keyframes n2 { 0%, 46.5% { fill: #101018; } 47.0%, 59.0% { fill: #7b93f5; } 67.0%, 100% { fill: #101018; } }
  .n3 { animation: n3 6s linear infinite; } @keyframes n3 { 0%, 60.3% { fill: #101018; } 60.8%, 72.8% { fill: #7b93f5; } 80.8%, 100% { fill: #101018; } }
  .n4 { animation: n4 6s linear infinite; } @keyframes n4 { 0%, 93.5% { fill: #101018; } 94.0%, 100% { fill: #7b93f5; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="320" height="318" rx="16" fill="url(#bg)"/>
<ellipse class="glow-a" cx="64" cy="31.8" rx="112" ry="190.79999999999998" fill="url(#glow-a)"/>
<ellipse class="glow-b" cx="256" cy="302.09999999999997" rx="112" ry="190.79999999999998" fill="url(#glow-b)"/>
<text x="16" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="800" letter-spacing="4" fill="#8b949e">WORKFLOW</text>
<line x1="36" y1="78" x2="36" y2="278" stroke="#7b93f5" stroke-opacity="0.3" stroke-width="2"/>
<circle class="pulse" cx="36" cy="78" r="4.5" fill="#9aabf5"/>
<g class="in" style="animation-delay:0.00s"><circle class="n0" cx="36" cy="78" r="8" fill="#101018" stroke="#7b93f5" stroke-width="2"/><text x="60" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14.5" font-weight="800" fill="#e6edf3">Design</text><text x="60" y="94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#8b949e">Figma</text></g>
<g class="in" style="animation-delay:0.08s"><circle class="n1" cx="36" cy="128" r="8" fill="#101018" stroke="#7b93f5" stroke-width="2"/><text x="60" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14.5" font-weight="800" fill="#e6edf3">Demo</text><text x="60" y="144" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#8b949e">pixel-close HTML</text></g>
<g class="in" style="animation-delay:0.16s"><circle class="n2" cx="36" cy="178" r="8" fill="#101018" stroke="#7b93f5" stroke-width="2"/><text x="60" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14.5" font-weight="800" fill="#e6edf3">Theme</text><text x="60" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#8b949e">ACF + i18n</text></g>
<g class="in" style="animation-delay:0.24s"><circle class="n3" cx="36" cy="228" r="8" fill="#101018" stroke="#7b93f5" stroke-width="2"/><text x="60" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14.5" font-weight="800" fill="#e6edf3">Audit</text><text x="60" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#8b949e">a11y · SEO · speed</text></g>
<g class="in" style="animation-delay:0.32s"><circle class="n4" cx="36" cy="278" r="8" fill="#101018" stroke="#7b93f5" stroke-width="2"/><text x="60" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14.5" font-weight="800" fill="#e6edf3">Ship</text><text x="60" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#8b949e">env sync</text></g>
<rect x="0.5" y="0.5" width="319" height="317" rx="15.5" fill="none" stroke="#7b93f5" stroke-opacity="0.62"/>
</svg>
