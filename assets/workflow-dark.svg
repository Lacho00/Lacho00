<svg xmlns="http://www.w3.org/2000/svg" width="860" height="166" viewBox="0 0 860 166" role="img" aria-label="How I work: Design (Figma), then Demo (pixel-close HTML), then Theme (ACF + i18n), then Audit (a11y · SEO · speed), then Ship (env sync).">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0a0a0f"/><stop offset="54%" stop-color="#101018"/><stop offset="100%" stop-color="#0a0a0f"/>
  </linearGradient>
  <radialGradient id="glow-a"><stop offset="0%" stop-color="#7b93f5" stop-opacity="0.13"/><stop offset="100%" stop-color="#7b93f5" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow-b"><stop offset="0%" stop-color="#3858e9" stop-opacity="0.12"/><stop offset="100%" stop-color="#3858e9" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .glow-a { animation: drift-a 14s ease-in-out infinite; }
  .glow-b { animation: drift-b 18s ease-in-out infinite; }
  .in { animation: fade-in 0.6s ease-out backwards; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes drift-a { 50% { transform: translate(40px, 12px); } }
  @keyframes drift-b { 50% { transform: translate(-36px, -10px); } }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse { animation: pulse 6s cubic-bezier(.45,0,.55,1) infinite; } @keyframes pulse { 0% { transform: translateX(0); opacity: 0; } 6% { opacity: 1; } 88% { opacity: 1; } 94%, 100% { transform: translateX(664px); opacity: 0; } }
  .n0 { animation: n0 6s linear infinite; } @keyframes n0 { 0%, 0.5% { fill: #101018; } 1.0%, 13.0% { fill: #7b93f5; } 21.0%, 100% { fill: #101018; } }
  .n1 { animation: n1 6s linear infinite; } @keyframes n1 { 0%, 32.7% { fill: #101018; } 33.2%, 45.2% { fill: #7b93f5; } 53.2%, 100% { fill: #101018; } }
  .n2 { animation: n2 6s linear infinite; } @keyframes n2 { 0%, 46.5% { fill: #101018; } 47.0%, 59.0% { fill: #7b93f5; } 67.0%, 100% { fill: #101018; } }
  .n3 { animation: n3 6s linear infinite; } @keyframes n3 { 0%, 60.3% { fill: #101018; } 60.8%, 72.8% { fill: #7b93f5; } 80.8%, 100% { fill: #101018; } }
  .n4 { animation: n4 6s linear infinite; } @keyframes n4 { 0%, 93.5% { fill: #101018; } 94.0%, 100% { fill: #7b93f5; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="860" height="166" rx="20" fill="url(#bg)"/>
<ellipse class="glow-a" cx="172" cy="16.6" rx="301" ry="99.6" fill="url(#glow-a)"/>
<ellipse class="glow-b" cx="688" cy="157.7" rx="301" ry="99.6" fill="url(#glow-b)"/>
<text x="30" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="800" letter-spacing="4" fill="#8b949e">HOW I WORK</text>
<line x1="98" y1="104" x2="762" y2="104" stroke="#7b93f5" stroke-opacity="0.3" stroke-width="2"/>
<circle class="pulse" cx="98" cy="104" r="5" fill="#9aabf5"/>
<g class="in" style="animation-delay:0.00s"><circle class="n0" cx="98" cy="104" r="9" fill="#101018" stroke="#7b93f5" stroke-width="2"/><text x="98" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14.5" font-weight="800" text-anchor="middle" fill="#e6edf3">Design</text><text x="98" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" text-anchor="middle" fill="#8b949e">Figma</text></g>
<g class="in" style="animation-delay:0.08s"><circle class="n1" cx="264" cy="104" r="9" fill="#101018" stroke="#7b93f5" stroke-width="2"/><text x="264" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14.5" font-weight="800" text-anchor="middle" fill="#e6edf3">Demo</text><text x="264" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" text-anchor="middle" fill="#8b949e">pixel-close HTML</text></g>
<g class="in" style="animation-delay:0.16s"><circle class="n2" cx="430" cy="104" r="9" fill="#101018" stroke="#7b93f5" stroke-width="2"/><text x="430" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14.5" font-weight="800" text-anchor="middle" fill="#e6edf3">Theme</text><text x="430" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" text-anchor="middle" fill="#8b949e">ACF + i18n</text></g>
<g class="in" style="animation-delay:0.24s"><circle class="n3" cx="596" cy="104" r="9" fill="#101018" stroke="#7b93f5" stroke-width="2"/><text x="596" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14.5" font-weight="800" text-anchor="middle" fill="#e6edf3">Audit</text><text x="596" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" text-anchor="middle" fill="#8b949e">a11y · SEO · speed</text></g>
<g class="in" style="animation-delay:0.32s"><circle class="n4" cx="762" cy="104" r="9" fill="#101018" stroke="#7b93f5" stroke-width="2"/><text x="762" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14.5" font-weight="800" text-anchor="middle" fill="#e6edf3">Ship</text><text x="762" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" text-anchor="middle" fill="#8b949e">env sync</text></g>
<rect x="0.5" y="0.5" width="859" height="165" rx="19.5" fill="none" stroke="#7b93f5" stroke-opacity="0.62"/>
